<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ingredient · Terpedia</title>
<style>body{max-width:46rem;margin:3rem auto;padding:0 1rem;font:1.05rem/1.6 system-ui;background:#fffcf3;color:#213f36}h1,h2{font-family:Georgia,serif}a{color:#245747}li{margin:.4em 0}p{overflow-wrap:anywhere}</style>
<a href="./">Terpedia Mixer</a><main><h1 id="name">Ingredient</h1><p id="identity"></p><h2>Supplier listings</h2><p id="status"></p><ul id="suppliers"></ul></main>
<script type="module">
const id = new URLSearchParams(location.search).get('id');
const [catalog, isolates, suppliers] = await Promise.all(['catalog','isolates','suppliers'].map(async file => (await fetch('./'+file+'.json')).json()));
const material = catalog.find(item => item.id === id);
const isolate = isolates.find(item => item.inchikey === id);
const heading = document.querySelector('h1');
heading.textContent = material?.name ?? (isolate ? isolate.name + ' isolate' : 'Unknown ingredient');
document.title = heading.textContent + ' · Terpedia';
const profile = Object.entries(material?.profile ?? {}).map(([name,pct]) => name+' '+pct+'%');
document.querySelector('#identity').textContent = isolate ? 'InChIKey · '+isolate.inchikey : [material?.type, profile.length ? 'Illustrative profile · '+profile.join(', ') : ''].filter(Boolean).join(' · ');
document.querySelector('#status').textContent = isolate ? 'Historical supplier listings. Confirm the catalog code, availability and assay with the supplier.' : 'No supplier listings are linked to this material.';
for (const {supplierId, code} of isolate?.listings ?? []) {
  const row = document.createElement('li');
  const link = document.createElement('a');
  link.href = './supplier.html?id=' + encodeURIComponent(supplierId);
  link.textContent = suppliers.find(s => s.id === supplierId).name;
  row.append(link, ' · ' + code);
  document.querySelector('#suppliers').append(row);
}
</script></html>
